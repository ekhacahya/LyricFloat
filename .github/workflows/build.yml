name: Build LyricFloat

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lyricfloat-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package macOS universal app
    runs-on: macos-15
    permissions:
      contents: write
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/.build/module-cache
      SWIFTPM_MODULECACHE_OVERRIDE: ${{ github.workspace }}/.build/module-cache
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test lyrics, playback, window placement, and local bridge
        run: swift test --disable-sandbox --scratch-path .build

      - name: Test browser companion
        run: node --test Tests/BrowserExtensionTests/*.test.cjs

      - name: Build and package app and extension
        run: ./scripts/package-release.sh --universal

      - name: Verify universal binary and signature
        run: |
          lipo dist/LyricFloat.app/Contents/MacOS/LyricFloat -verify_arch arm64 x86_64
          codesign --verify --deep --strict dist/LyricFloat.app
          plutil -lint dist/LyricFloat.app/Contents/Info.plist

      - name: Upload macOS app
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          path: dist/packages/LyricFloat-macos-universal.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload browser extension
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          path: dist/packages/LyricFloat-browser-extension.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload checksums
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          path: dist/packages/SHA256SUMS
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/LyricFloat.app/Contents/Info.plist)
          TAG="v$VERSION-build.$GITHUB_RUN_NUMBER"
          cat > /tmp/lyricfloat-release.md <<'NOTES'
          Download **LyricFloat-macos-universal.zip** for macOS 13+ (Apple Silicon and Intel).
          Download **LyricFloat-browser-extension.zip**, extract it into a permanent folder, then use your browser's **Load unpacked** option.
          Follow the README to pair the browser with the app.

          The app is ad-hoc signed and has not been notarized by Apple.
          NOTES
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/packages/* --clobber
          else
            gh release create "$TAG" dist/packages/* --target "$GITHUB_SHA" --title "LyricFloat $VERSION · Build $GITHUB_RUN_NUMBER" --notes-file /tmp/lyricfloat-release.md --latest
          fi

      - name: Write download instructions
        if: github.event_name != 'pull_request'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### LyricFloat downloads
          Download the latest public build from **Releases** on the repository page. Copies are also available in **Artifacts** below:
          - **LyricFloat-macos-universal.zip** — macOS app for Apple Silicon and Intel.
          - **LyricFloat-browser-extension.zip** — unpack into a permanent folder, then load it in your browser.
          - **SHA256SUMS** — archive checksums.

          The app is ad-hoc signed, not Apple-notarized. No custom GitHub secrets are needed.
          SUMMARY
